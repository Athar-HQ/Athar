title: Phishing Kit - Evilginx and evilgophish title
id: d547098c-4754-4b94-85d6-0ad4d1b3c2db
status: experimental
description: |
  Evilginx is a reverse-proxy phishing framework that bypasses MFA;
  evilgophish combines it with GoPhish. Their panels put the name first in the
  title, as in "Evilginx - Login" and "evilgophish - Login". The rule matches
  titles that start with "Evilginx" or "evilgophish", so pages that only
  mention the tool, such as its documentation ("Introduction | Evilginx"), do
  not match. The original queries are kept under native.
references:
  - https://github.com/kgretzky/evilginx2
  - https://github.com/fin3ss3g0d/evilgophish
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.phishing-kit
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title|startswith:
      - 'Evilginx'
      - 'evilgophish'
  condition: selection_title
identifies:
  product: Evilginx
  family: evilginx
  category: phishing-kit
confidence: medium
falsepositives:
  - Authorised phishing simulations and red-team engagements
  - Security awareness teams that run Evilginx for simulations
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Evilginx title
    expect: match
    response:
      http.title: 'Evilginx Admin'
  - name: evilgophish title
    expect: match
    response:
      http.title: 'evilgophish'
  - name: Documentation page
    expect: no_match
    response:
      http.title: 'Introduction | Evilginx'
  - name: Generic phishing title
    expect: no_match
    response:
      http.title: 'Phishing awareness training'
native:
  modat: 'same_service(service="http" transport="tcp" (web.title~"Evilginx" or web.title~"evilgophish" or cert.issuer.org="Evilginx API")) or product="Evilginx"'
