title: C2 - Metasploit self-signed CA certificate
id: 693865f3-e873-4230-99f9-653159b4a0d3
status: experimental
description: |
  Certificates whose issuer common name contains "MetasploitSelfSignedCA", a
  name seen on Metasploit HTTPS handlers. The current Metasploit source
  (rex-socket) generates a random issuer by default, so this name comes from
  handlers configured with it, not from a default in the code; confidence is
  medium. The original queries are kept under native.
references:
  - https://github.com/rapid7/metasploit-framework
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: tcp
  tls: required
  ports: [443, 8443]
detection:
  selection_ca:
    tls.cert.issuer.cn|contains: 'MetasploitSelfSignedCA'
  condition: selection_ca
identifies:
  product: Metasploit
  family: metasploit
  category: c2
confidence: medium
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
  - Lab setups that copied the name
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Handler certificate
    expect: match
    response:
      tls.cert.issuer.cn: 'MetasploitSelfSignedCA'
  - name: Other CA
    expect: no_match
    response:
      tls.cert.issuer.cn: 'Example Self Signed CA'
native:
  modat: 'same_service( transport="tcp" cert.issuer.cn~"MetasploitSelfSignedCA")'
