title: C2 - Viper C2 favicon
id: 96491f93-f87d-41bf-9ce7-9ff94e0ee8bd
status: experimental
description: |
  Favicon of the Viper C2 platform, by its MD5. It finds Viper servers
  whatever their title says; the title rule needs the landing page hash as
  well, because the title "VIPER" alone is common.
references:
  - Internal Research
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: http
  tls: auto
detection:
  selection_icon:
    http.favicon.md5: 'a7469955bff5e489d2270d9b389064e1'
  condition: selection_icon
identifies:
  product: Viper
  family: viper
  category: c2
confidence: high
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Favicon
    expect: match
    response:
      http.favicon.md5: 'a7469955bff5e489d2270d9b389064e1'
  - name: Other favicon
    expect: no_match
    response:
      http.favicon.md5: 'a7469955bff5e489d2270d9b389064e2'
native:
  censys: 'host.services.endpoints.http.body_hash_sha1="cd40dbcdae84b1c8606f29342066547069ed5a33" or host.services.endpoints.http.favicons.hash_md5="a7469955bff5e489d2270d9b389064e1" or web.endpoints.http.body_hash_sha1="cd40dbcdae84b1c8606f29342066547069ed5a33" or web.endpoints.http.favicons.hash_md5="a7469955bff5e489d2270d9b389064e1"'
