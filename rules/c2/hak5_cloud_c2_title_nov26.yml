title: C2 - Hak5 Cloud C2 title
id: 7b08f1f6-01cb-4d9f-b751-cbedcd5d0b9a
status: experimental
description: |
  Cloud C2 by Hak5 manages Hak5 implants (Pineapple, Shark Jack and others).
  Its login page title contains "Hak5 Cloud". The original query also listed
  five SHA-256 values of the page, which are covered by a separate rule. The
  original queries are kept under native.
references:
  - https://docs.hak5.org/cloud-c2
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title|contains: 'Hak5 Cloud'
  condition: selection_title
identifies:
  product: Hak5 Cloud C2
  family: hak5-cloudc2
  category: c2
confidence: high
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
  - Hak5 operating its own Cloud C2 demo
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Login page
    expect: match
    response:
      http.title: 'Hak5 Cloud C2'
  - name: Hak5 shop
    expect: no_match
    response:
      http.title: 'Hak5 - Shop'
native:
  modat: 'same_service(service="http" transport="tcp" web.html.sha256=231f850bab2ab756238ec7cbb735754807e130f55df9372220cfa2145aa2397d or web.html.sha256=e44ede0890d5baf4805a34185e65a28c5cfd53052b080ba72026d69445f636a8 or web.html.sha256=e9fd968b026e008fb928498ad0dff4e3ad094ff674b8fc39d31fb75aa3a16af2  or web.html.sha256=5740925e5d95c895c23c63865975682756342a212829948c085c7676f8e3db35 or web.html.sha256=ae046e373993140119157173e488ab5da820420f2d57e21a6860c81660fe02c7 or web.title~"Hak5 Cloud")'
  censys: 'host.services.endpoints.http.favicons.hash_md5="57f501d6fee2fdb024795abbdb750ad5" or ((host.services.software.product:"cloud c2" or host.services.hardware.product:"cloud c2" or host.services.operating_systems.product:"cloud c2") and (host.services.software.vendor:"Hak5" or host.services.hardware.vendor:"Hak5" or host.services.operating_systems.vendor:"Hak5")) or web.endpoints.http.favicons.hash_md5="57f501d6fee2fdb024795abbdb750ad5" or ((web.software.product:"cloud c2" or web.hardware.product:"cloud c2" or web.operating_systems.product:"cloud c2") and (web.software.vendor:"Hak5" or web.hardware.vendor:"Hak5" or web.operating_systems.vendor:"Hak5"))'
