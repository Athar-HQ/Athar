title: C2 - Pivot-C2 response body marker
id: 86b90645-a9f3-4656-a568-f9d4a65911b2
status: experimental
description: |
  A listener whose body contains the fixed string "VxwFClQDHQQGFwROTWV". The
  string is opaque, so the rule is only medium confidence and has no test on
  a real page.
references:
  - Internal Research
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: http
  tls: auto
detection:
  selection_body:
    http.body|contains|cased: 'VxwFClQDHQQGFwROTWV'
  condition: selection_body
identifies:
  product: Pivot-C2
  family: pivot-c2
  category: c2
confidence: medium
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Marker in the body
    expect: match
    response:
      http.body: '<html>VxwFClQDHQQGFwROTWV</html>'
  - name: Similar random string
    expect: no_match
    response:
      http.body: '<html>VxwFClQDHQQGFwROTWX</html>'
native:
  modat: 'same_service(tls.subject.common_name="pivot-c2" and tls.issuer.common_name="pivot-c2") or same_service(http.body~"VxwFClQDHQQGFwROTWV")'
