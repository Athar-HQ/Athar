title: C2 - Pivot-C2 certificate
id: 2473b9c2-3978-4406-bd71-e03a64e24f65
status: experimental
description: |
  Pivot-C2 listeners present a certificate whose subject and issuer common
  names are both "pivot-c2". The original query's second alternative, a body
  fragment, is covered by a separate rule.
references:
  - Internal Research
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: tcp
  tls: required
detection:
  selection_cert:
    tls.cert.subject.cn: 'pivot-c2'
    tls.cert.issuer.cn: 'pivot-c2'
  condition: selection_cert
identifies:
  product: Pivot-C2
  family: pivot-c2
  category: c2
confidence: high
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Default certificate
    expect: match
    response:
      tls.cert.subject.cn: 'pivot-c2'
      tls.cert.issuer.cn: 'pivot-c2'
  - name: Other self-signed certificate
    expect: no_match
    response:
      tls.cert.subject.cn: 'localhost'
      tls.cert.issuer.cn: 'localhost'
native:
  modat: 'same_service(tls.subject.common_name="pivot-c2" and tls.issuer.common_name="pivot-c2") or same_service(http.body~"VxwFClQDHQQGFwROTWV")'
