title: C2 - CyberC2 panel title
id: a1947bd2-8c59-4d6b-96c0-6166b9eff33e
status: experimental
description: |
  Web panel of CyberC2, a command-and-control framework. The rule matches the
  panel's page title "CyberC2 - Command & Control" as a substring, so longer
  titles that contain it match too. The title names the product, so a match is
  specific.
references:
  - Internal Research
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title|contains: 'CyberC2 - Command & Control'
  condition: selection_title
identifies:
  product: CyberC2
  family: cyberc2
  category: c2
confidence: high
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Panel
    expect: match
    response:
      http.title: 'CyberC2 - Command & Control'
  - name: Similar title
    expect: no_match
    response:
      http.title: 'CyberSecurity - Command Center'
native:
  modat: 'web.title~"CyberC2 - Command & Control"'
