title: C2 - PureRAT agent certificate
id: 28e518b0-a61e-436a-b0b4-4058415b8642
status: experimental
description: |
  PureRAT listeners present a self-signed certificate whose subject and
  issuer are both "PureRAT Agent". abuse.ch SSLBL lists many such
  certificates. The original query also searched the engine label
  product=PureRAT, which has no taxonomy field and is dropped. The original
  queries are kept under native.
references:
  - https://sslbl.abuse.ch/ssl-certificates/sha1/891676e8c7f77b79942835d2079e1ea1bcb6a7ae
  - https://brandefense.io/odin-research/blog/tax-lures-hidden-desktops-and-cookie-theft-around-purerat/
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - attack.command_and_control
  - category.c2
target:
  protocol: tcp
  tls: required
detection:
  selection_cert:
    tls.cert.subject.cn: 'PureRAT Agent'
    tls.cert.issuer.cn: 'PureRAT Agent'
  condition: selection_cert
identifies:
  product: PureRAT
  family: purerat
  category: c2
confidence: high
falsepositives:
  - Authorised red-team or research deployments (the tooling is dual-use)
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Agent certificate
    expect: match
    response:
      tls.cert.subject.cn: 'PureRAT Agent'
      tls.cert.issuer.cn: 'PureRAT Agent'
  - name: Similar name
    expect: no_match
    response:
      tls.cert.subject.cn: 'PureRAT Agent Services'
      tls.cert.issuer.cn: 'PureRAT Agent Services'
  - name: Other self-signed certificate
    expect: no_match
    response:
      tls.cert.subject.cn: 'ChromeServer'
      tls.cert.issuer.cn: 'ChromeServer'
native:
  modat: 'product=PureRAT or same_service(service="unknown" transport="tcp" cert.issuer.cn="PureRAT Agent"  cert.subject.cn="PureRAT Agent")'
