title: Agentic Offensive Framework - OPX
id: 876d83c3-a599-42fe-910c-ba92eadaf833
related:
  - id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b   # Agentic Offensive Framework - ARTEX family
    type: similar
status: experimental
description: |
  The OPX-branded deployment of the ARTEX family, first seen on 2026-11-25.
  It replaces the family's title suffix with '运维控制台' ("operations
  console"), so the title reads 'OPX — 运维控制台'. The rest of the landing
  page is the family's: the same Next.js stylesheet, the meta description
  'LLM 驱动的自主渗透测试系统控制台' and a redirect to /function/tasks.
  Unrelated operations dashboards use the same title words, so the rule also
  needs the meta description and the OPX brand at the start of the title.
  Linked as similar rather than variant-of because the family rule does not
  match this title. Widening the family title instead would need a body
  condition, which Shodan cannot OR with the other titles.
  Confidence is medium because the rule rests on a single console, found in
  our own scan; no published hunt confirms the brand.
author: Florian Roth
date: 2026-11-25
modified: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [18800]   # the only OPX console seen so far (2026-11-25)
detection:
  selection_ops_title:
    http.title|contains: '运维控制台'
  selection_meta:
    http.body|contains: 'LLM 驱动的自主渗透测试系统控制台'
  selection_brand:
    http.title|startswith: 'OPX'
  condition: selection_ops_title and selection_meta and selection_brand
identifies:
  product: OPX
  family: artex
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # The match test is an excerpt of the landing page an OPX console served
  # on 2026-11-25. The no_match tests are samples.
  - name: OPX console
    expect: match
    response:
      http.title: 'OPX — 运维控制台'
      http.body: '<link rel="preload" href="/_next/static/chunks/4384baud_6ozc.css" as="style"/><link rel="preload" href="/_next/static/chunks/376abrpuqh_at.css" as="style"/><title>OPX — 运维控制台</title><meta name="description" content="LLM 驱动的自主渗透测试系统控制台"/><link rel="icon" href="/favicon.ico?favicon.1uboyqwm7-s27.ico" sizes="48x48" type="image/x-icon"/>'
  - name: Unrelated operations console named OPX
    expect: no_match
    response:
      http.title: 'OPX 运维控制台 - 登录'
      http.body: '<title>OPX 运维控制台 - 登录</title><meta name="description" content="统一运维管理平台"/>'
  - name: Other brand with the operations console title
    expect: no_match
    response:
      http.title: 'NKW — 运维控制台'
      http.body: '<title>NKW — 运维控制台</title><meta name="description" content="LLM 驱动的自主渗透测试系统控制台"/>'
