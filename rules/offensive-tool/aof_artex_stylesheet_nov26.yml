title: Agentic Offensive Framework - ARTEX stylesheets
id: ec6bb4f5-737d-4a20-ad55-7054aa89cb41
related:
  - id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b   # Agentic Offensive Framework - ARTEX family
    type: similar
  - id: a13d3b6f-cf60-4f55-965f-62462cdb8213   # Agentic Offensive Framework - ARTEX frontend files
    type: similar
status: experimental
description: |
  Paths of the console's Next.js stylesheets, one per build seen on
  urlscan.io up to 2026-11-25. The landing page names its stylesheet near the
  top of the HTML, so the rule does not depend on the title and also finds
  rebrands that changed it (VaptX, ARTIFEX, HACK DOG, Cybrion, ArkanaAI).
  File names come from the build; a new build adds new names. Linked as
  similar rather than variant-of because it does not repeat the family title.
  The ARTEX frontend files rule checks the same files by SHA-256, which
  urlscan.io can search; keep the two lists in step.
references:
  - https://urlscan.io/search/#hash%3Aff75f55ed6baeb22cee166fd7281a5f3b9243678b9b04ae41c8a84ae39cc02f5
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8787, 8443, 443, 80]   # most consoles listen on 8787 (Modat, 2026-11-25)
detection:
  selection_stylesheet:
    http.body|contains:
      - '/_next/static/chunks/4384baud_6ozc.css'
      - '/_next/static/chunks/33cj8z03rhzhn.css'
      - '/_next/static/chunks/21_ph5otuqxv2.css'
      - '/_next/static/chunks/3ij6fl1kqv7_b.css'
      - '/_next/static/css/eba9231147484ecf.css'
      - '/_next/static/chunks/2ks5kxw4iystr.css'
      - '/_next/static/chunks/2qc_y9g_-62l-.css'
      - '/_next/static/chunks/0ssdcatqoq6i-.css'
      - '/_next/static/chunks/3em9qoz6fv46y.css'
      - '/_next/static/chunks/1w2j12qeluzit.css'
      - '/_next/static/chunks/3hq2fsi98ozj1.css'
  condition: selection_stylesheet
identifies:
  family: artex
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Excerpts of the landing page as urlscan.io captured it on 2026-11-25.
  - name: ARTEX console
    expect: match
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
      http.body: '<script src="/_next/static/chunks/12j-n_j2swqsy.js" async=""></script><link rel="preload" href="/_next/static/chunks/4384baud_6ozc.css" as="style"/>'
  - name: Rebrand with its own title
    expect: match
    response:
      http.title: 'VaptX'
      http.body: '<link rel="preload" href="/_next/static/chunks/4384baud_6ozc.css" as="style"/>'
  - name: Older build with webpack file names
    expect: match
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
      http.body: '<link rel="stylesheet" href="/_next/static/css/eba9231147484ecf.css" data-precedence="next"/>'
  - name: Other Next.js application
    expect: no_match
    response:
      http.title: 'Dashboard'
      http.body: '<link rel="preload" href="/_next/static/chunks/0d3f9a1c7b2e.css" as="style"/>'
