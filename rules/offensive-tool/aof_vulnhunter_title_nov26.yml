title: Agentic Offensive Framework - VulnHunter title and body
id: 0e062573-b0b2-49c0-af8a-868984dd9244
status: experimental
description: |
  Console of an AI-driven vulnerability-discovery platform named VulnHunter.
  The original query matched "VulnHunter" anywhere in the title or body.
  Several unrelated projects share the name, so the rule is medium
  confidence; the title alone is the stronger signal and the body match is a
  weaker catch-all. The original queries are kept under native.
references:
  - https://github.com/Clouditera/VulnHunter
  - https://theravenfile.com/2026/11/22/ai-agentic-pentest-framework-in-the-wild/
author: Shared by trusted source
date: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title|contains: 'VulnHunter'
  condition: selection_title
identifies:
  product: VulnHunter
  family: vulnhunter
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
  - Other projects named VulnHunter (a Capital One scanner and a smart-contract tool)
  - Marketing and documentation pages
tests:
  # Minimal samples built from the published indicators, not captured responses.
  - name: Console
    expect: match
    response:
      http.title: 'VulnHunter'
  - name: Login title
    expect: match
    response:
      http.title: 'VulnHunter - Login'
  - name: Different product
    expect: no_match
    response:
      http.title: 'Vulnerability Hunters Club'
native:
  modat: 'same_service(protocol="http" transport="tcp" http.files.sha256=a81f6c8080c60ff7f045ba4c492060dda8879cc625da20a04b8356e969393048 or http.title~"VulnHunter" or http.body~"VulnHunter")'
