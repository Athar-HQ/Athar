tests:
  # Minimal samples built from values in the project repository.
  - name: Viewer icon
    expect: match
    response:
      http.favicon.sha256: 'a6d5ca4b84523e651c7151d0bcb6bc0c132ecc311566bb48ed2da6c82efcb9eb'
  - name: Other icon
    expect: no_match
