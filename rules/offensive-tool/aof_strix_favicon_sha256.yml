description: |
  Results viewer of Strix, an open-source AI penetration testing tool that runs autonomous agents against applications. Matched by the viewer icon logo.png by its SHA-256, for engines that store
  that hash (Censys, Modat). Computed from the file in the repository.
references:
  - https://github.com/usestrix/strix
  - https://definitely-not-c2.com/Autonomous_AI_Hunting/
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_main:
    http.favicon.sha256: 'a6d5ca4b84523e651c7151d0bcb6bc0c132ecc311566bb48ed2da6c82efcb9eb'
  condition: selection_main
identifies:
  product: Strix
  family: strix
  category: offensive-tool
confidence: high
falsepositives:
