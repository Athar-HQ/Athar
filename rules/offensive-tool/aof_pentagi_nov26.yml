title: Agentic Offensive Framework - PentAGI
id: 22406af1-42ab-45b8-b540-9868e65d5c5e
status: experimental
description: |
  Web console of PentAGI, an open-source system of autonomous AI agents for
  penetration testing. Matched by the page title the project's frontend sets
  ("PentAGI"). The favicon and the default certificate are separate rules, so
  that each signal converts to every engine that can search it. The console
  listens on 8443 and binds to 127.0.0.1 by default, so an exposed instance
  was opened up on purpose.
references:
  - https://github.com/vxcontrol/pentagi
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8443]
detection:
  selection_title:
    http.title: 'PentAGI'
  condition: selection_title
identifies:
  product: PentAGI
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
  - Demo or documentation sites that use the product name as their title
tests:
  # Minimal samples built from the title in frontend/index.html.
  - name: Console title
    expect: match
    response:
      http.title: 'PentAGI'
  - name: Article about the project
    expect: no_match
    response:
      http.title: 'PentAGI: autonomous AI agents for penetration testing'
  - name: Similar word
    expect: no_match
    response:
      http.title: 'Pentagon Industries'
native:
  fofa: 'title=="PentAGI"'
