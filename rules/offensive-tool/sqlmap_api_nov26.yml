title: Offensive Tool - sqlmap REST API server
id: 3a121e53-e989-4c7c-ae00-27b811541750
status: experimental
description: |
  REST API server of sqlmap, the open-source SQL injection tool
  (sqlmapapi.py -s), which lets a client start and steer scans remotely.
  Current versions require a username and password, and a request without
  them is answered 401 by lib/utils/api.py with an unusual set of headers:
  security_headers replaces the Server header with the literal word
  "Server", sets Pragma "no-cache" and Expires "0", and declares a JSON
  content type for an empty body. There is no WWW-Authenticate header,
  although the status is 401. The rule requires the status, the literal
  Server value, the content type, the Expires value and the missing
  challenge together. No single one identifies the tool, so the confidence
  is medium. Search engines can't test for a missing header, so their
  queries drop that part.
references:
  - https://github.com/sqlmapproject/sqlmap
  - https://github.com/sqlmapproject/sqlmap/blob/master/lib/utils/api.py
author: Ialle Teixeira
date: 2026-11-28
tags:
  - attack.initial_access
  - attack.t1190
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
target:
  protocol: http
  tls: auto
  ports: [8775]   # RESTAPI_DEFAULT_PORT
detection:
  selection_unauthorized:
    http.status_code: 401
    http.headers.server: 'Server'
    http.headers.content-type: 'application/json; charset=UTF-8'
    http.headers.expires: '0'
  filter_challenge:
    http.headers.www-authenticate|exists: true
  condition: selection_unauthorized and not filter_challenge
identifies:
  product: sqlmap
  family: sqlmap
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised use by penetration testers (the tool is dual-use)
  - Other applications that replace their Server header with the word "Server" and answer 401 without a challenge
tests:
  # Captured on 2026-11-28 from the API server of sqlmap 1.10.11 started on
  # localhost with a username and password.
  - name: Request without credentials
    expect: match
    raw: "HTTP/1.0 401 Unauthorized\r\nDate: Sat, 28 Nov 2026 15:52:39 GMT\r\nServer: Server\r\nX-Content-Type-Options: nosniff\r\nX-Frame-Options: DENY\r\nX-Xss-Protection: 1; mode=block\r\nPragma: no-cache\r\nCache-Control: no-cache\r\nExpires: 0\r\nContent-Type: application/json; charset=UTF-8\r\nContent-Length: 0\r\n\r\n"
  # Made-up near misses.
  - name: Same headers with a Basic challenge
    expect: no_match
    raw: "HTTP/1.1 401 Unauthorized\r\nServer: Server\r\nExpires: 0\r\nWWW-Authenticate: Basic realm=\"api\"\r\nContent-Type: application/json; charset=UTF-8\r\nContent-Length: 0\r\n\r\n"
  - name: JSON API behind a named server
    expect: no_match
    raw: "HTTP/1.1 401 Unauthorized\r\nServer: nginx\r\nExpires: 0\r\nContent-Type: application/json; charset=UTF-8\r\nContent-Length: 0\r\n\r\n"
  - name: Same headers on a successful answer
    expect: no_match
    response:
      http.status_code: 200
      http.headers.server: 'Server'
      http.headers.content-type: 'application/json; charset=UTF-8'
      http.headers.expires: '0'
