title: Agentic Offensive Framework - CyberStrikeAI
id: 2876eb4d-df28-4cf0-ac9a-7b831e1d5139
status: experimental
description: |
  Web console of CyberStrikeAI, an open-source AI-driven penetration testing
  platform written in Go that orchestrates more than 100 offensive tools.
  Recognised by any of three signals from the project's own frontend: the
  page title "CyberStrikeAI", the favicon shipped in the repository
  (web/static/favicon.ico, mmh3 -1349384020), or the two-part wordmark in the
  page body ("CyberStrike" plus a separate "AI" span).
references:
  - https://github.com/AIPentest/CyberStrikeAI
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title: 'CyberStrikeAI'
  selection_icon:
    http.favicon.mmh3: -1349384020
  selection_wordmark:
    http.body|contains: 'CyberStrike</span><span class="brand-wordmark__ai">AI'
  condition: 1 of selection_*
identifies:
  product: CyberStrikeAI
  family: cyberstrikeai
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
  - Demo or documentation sites of the project that serve its frontend
tests:
  # The favicon hash is computed from web/static/favicon.ico in the project
  # repository; the title and wordmark are minimal samples.
  - name: Console title
    expect: match
    response:
      http.title: 'CyberStrikeAI'
  - name: Project favicon with another title
    expect: match
    response:
      http.title: 'Dashboard'
      http.favicon.mmh3: -1349384020
  - name: Wordmark in the page body
    expect: match
    response:
      http.body: '<a class="brand"><span class="brand-wordmark">CyberStrike</span><span class="brand-wordmark__ai">AI</span></a>'
  - name: Similarly named project
    expect: no_match
    response:
      http.title: 'CyberStrike'
      http.body: '<h1>CyberStrike</h1>'
  - name: Article about the tool
    expect: no_match
    response:
      http.title: 'CyberStrikeAI: an AI attack kit goes open source'
      http.body: '<p>CyberStrikeAI combines more than 100 tools.</p>'
native:
  fofa: 'title=="CyberStrikeAI" || icon_hash="-1349384020" || body="CyberStrike</span><span class=\"brand-wordmark__ai\">AI"'
