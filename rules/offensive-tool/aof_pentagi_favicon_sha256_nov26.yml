title: Agentic Offensive Framework - PentAGI favicon (SHA-256)
id: f4e9daf6-6591-46e7-a4db-a60736679b48
related:
  - id: 22406af1-42ab-45b8-b540-9868e65d5c5e   # Agentic Offensive Framework - PentAGI
    type: similar
  - id: 4e88da89-a27f-4f67-a273-c5d5b49f18a1   # Agentic Offensive Framework - PentAGI favicon
    type: similar
status: experimental
description: |
  The same favicons as the PentAGI favicon rule, by their SHA-256, for engines
  that store that hash instead of MurmurHash3 (Censys, Modat). The hashes are
  computed from frontend/public/favicon/favicon-96x96.png, favicon.svg and
  favicon.ico in the project repository.
references:
  - https://github.com/vxcontrol/pentagi
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8443]
detection:
  selection_icon:
    http.favicon.sha256:
      - 2a620e3c5f7b49dfc6f5278352607f7931f8c38ef9d4689908af65538dd95366   # favicon-96x96.png, the first icon the page links
      - c3667d36ed782d868a693a16530bd91df49417b6ece9ab63f57a1cacdeebc773   # favicon.svg
      - ec0eb56172d3c3fd926c7cee40c36624aee63369f3fab227408b5575756232bb   # favicon.ico
  condition: selection_icon
identifies:
  product: PentAGI
  family: pentagi
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  - name: favicon.ico
    expect: match
    response:
      http.favicon.sha256: ec0eb56172d3c3fd926c7cee40c36624aee63369f3fab227408b5575756232bb
  - name: favicon.svg
    expect: match
    response:
      http.favicon.sha256: c3667d36ed782d868a693a16530bd91df49417b6ece9ab63f57a1cacdeebc773
  - name: favicon-96x96.png, the icon athar scan fetches
    expect: match
    response:
      http.favicon.sha256: 2a620e3c5f7b49dfc6f5278352607f7931f8c38ef9d4689908af65538dd95366
  - name: Other favicon
    expect: no_match
    response:
      http.favicon.sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
