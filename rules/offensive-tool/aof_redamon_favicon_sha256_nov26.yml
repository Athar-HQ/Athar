title: Agentic Offensive Framework - RedAmon favicon (SHA-256)
id: 91b13e8c-ad91-4663-80b8-64d7ac27358f
related:
  - id: ce6d9777-bf15-4864-a7e4-4628692bf699   # Agentic Offensive Framework - RedAmon
    type: similar
  - id: 3813e5e0-bd76-4277-a3f6-96fe2c02cbd0   # Agentic Offensive Framework - RedAmon favicon
    type: similar
status: experimental
description: |
  The same icons as the RedAmon favicon rule, by their SHA-256, for engines
  that store that hash instead of MurmurHash3 (Censys, Modat). Computed from
  webapp/public/favicon.ico and favicon.png in the project repository.
references:
  - https://github.com/samugit83/redamon
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_icon:
    http.favicon.sha256:
      - 94309d127e1669150c5fd002b4dfd5c7168ee654d4022f6ecb8ad376d92e8ac5   # favicon.ico
      - ee50a0eb4fc75bda9e004889c2d3c43b0b4c15178aeea66e2eda52e338674201   # favicon.png
  condition: selection_icon
identifies:
  product: RedAmon
  family: redamon
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  - name: favicon.ico
    expect: match
    response:
      http.favicon.sha256: 94309d127e1669150c5fd002b4dfd5c7168ee654d4022f6ecb8ad376d92e8ac5
  - name: favicon.png
    expect: match
    response:
      http.favicon.sha256: ee50a0eb4fc75bda9e004889c2d3c43b0b4c15178aeea66e2eda52e338674201
  - name: Other favicon
    expect: no_match
    response:
      http.favicon.sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
