title: Agentic Offensive Framework - PentAGI default certificate
id: 8a3101b1-79ac-4e85-b2b4-fe38ed3b9316
related:
  - id: 4e88da89-a27f-4f67-a273-c5d5b49f18a1   # Agentic Offensive Framework - PentAGI favicon
    type: similar
status: experimental
description: |
  The self-signed certificate that PentAGI's scripts/entrypoint.sh creates
  when no certificate is supplied: O=PentAGI, CN=localhost, issued by a local
  CA named "PentAGI CA". The rule uses the issuer name because athar convert
  turns it into a query on every engine that indexes certificates; it has no
  mapping for the subject organisation yet. Finds consoles behind a proxy or
  with a changed title, as long as the default certificate is kept.
references:
  - https://github.com/vxcontrol/pentagi
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: required
  ports: [8443]
detection:
  selection_ca:
    tls.cert.issuer.cn: 'PentAGI CA'
  condition: selection_ca
identifies:
  product: PentAGI
  family: pentagi
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Certificate names are taken from scripts/entrypoint.sh in the project repository.
  - name: Default certificate behind a proxy page
    expect: match
    response:
      http.title: '502 Bad Gateway'
      tls.cert.subject.o: 'PentAGI'
      tls.cert.subject.cn: 'localhost'
      tls.cert.issuer.cn: 'PentAGI CA'
  - name: Public CA certificate
    expect: no_match
    response:
      http.title: 'PentAGI'
      tls.cert.issuer.cn: 'R11'
  - name: Other CA with a similar name
    expect: no_match
    response:
      tls.cert.issuer.cn: 'PentAGI Consulting CA'
native:
  # 2026-11-25: 231 results; titles PentAGI, Anxinsec, Specter.
  shodan: 'ssl.cert.issuer.cn:"PentAGI CA"'
  # 2026-11-25: 1,419 results.
  fofa: 'cert.issuer.cn=="PentAGI CA"'
  # 2026-11-25: 3 results (2 "Login — PentAGI", 1 "PentAGI").
  urlscan: 'page.tlsIssuer:"PentAGI CA"'
