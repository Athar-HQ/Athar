title: Agentic Offensive Framework - CyberStrikeAI wordmark
id: 45f674f9-c2dc-4e65-b075-78b764bbc680
related:
  - id: 2876eb4d-df28-4cf0-ac9a-7b831e1d5139   # Agentic Offensive Framework - CyberStrikeAI
    type: similar
status: experimental
description: |
  CyberStrikeAI wordmark markup in the page body. Releases after v1.8.1 drop
  it; the other CyberStrikeAI rules still match them.
references:
  - https://github.com/AIPentest/CyberStrikeAI
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_wordmark:
    http.body|contains: 'CyberStrike</span><span class="brand-wordmark__ai">AI'
  condition: selection_wordmark
identifies:
  product: CyberStrikeAI
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Minimal samples built from web/templates/index.html in v1.8.1 and
  # web/static/app/index.html on the main branch.
  - name: Wordmark in the page body
    expect: match
    response:
      http.body: '<span class="brand-wordmark brand-wordmark--sm" aria-label="CyberStrikeAI"><span class="brand-wordmark__core">CyberStrike</span><span class="brand-wordmark__ai">AI</span></span>'
  - name: Product name as plain text
    expect: no_match
    response:
      http.body: '<p>CyberStrikeAI combines more than 100 tools.</p>'
  - name: React interface after v1.8.1
    expect: no_match
    response:
      http.title: 'CyberStrikeAI'
      http.body: '<html lang="zh-CN" data-theme="light"><head><title>CyberStrikeAI</title><link rel="icon" href="/static/favicon.ico"></head><body><div id="root"></div></body></html>'
native:
  fofa: 'body="CyberStrike</span><span class=\"brand-wordmark__ai\">AI"'
