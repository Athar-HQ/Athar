title: Agentic Offensive Framework - PentAGI certificate name
id: e6346bf9-46b3-494c-9d9c-0099802168bd
related:
  - id: 4e88da89-a27f-4f67-a273-c5d5b49f18a1   # Agentic Offensive Framework - PentAGI favicon
    type: similar
status: experimental
description: |
  The DNS name pentagi.local in the self-signed certificate PentAGI creates in
  scripts/entrypoint.sh (subjectAltName=DNS:pentagi.local). Complements the
  issuer rule for the same certificate. Censys, Modat and Hunt.io index
  certificate names; on FOFA, Shodan, ZoomEye and urlscan.io this rule is for
  the scanner and for stored data.
references:
  - https://github.com/vxcontrol/pentagi
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
modified: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: required
detection:
  selection_main:
    tls.cert.san: 'pentagi.local'
  condition: selection_main
identifies:
  product: PentAGI
  family: pentagi
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Minimal samples built from values in the project repository.
  - name: Default certificate
    expect: match
    response:
      tls.cert.subject.cn: 'localhost'
      tls.cert.issuer.cn: 'PentAGI CA'
      tls.cert.san: ['pentagi.local']
  - name: Other local name
    expect: no_match
    response:
      tls.cert.san: ['pentagi.example.com']
