status: experimental
description: |
  Tencent's AI-Infra-Guard is an AI red-teaming and infrastructure-scanning
  platform. The rule matches the SHA-256 of its console page given in the
  original query. The original query's `http.files.sha256` alternative is a
  favicon and is covered by its own rule.
references:
