title: Agentic Offensive Framework - ARTEX frontend files
id: a13d3b6f-cf60-4f55-965f-62462cdb8213
related:
  - id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b   # Agentic Offensive Framework - ARTEX family
    type: similar
  - id: ec6bb4f5-737d-4a20-ad55-7054aa89cb41   # Agentic Offensive Framework - ARTEX stylesheets
    type: similar
status: experimental
description: |
  Stylesheets of the console's Next.js frontend, identified by their SHA-256.
  Each file has a custom probe that fetches it and a selection that checks its
  hash, so a match means the service serves exactly that file, whatever its
  title says. The list holds one app stylesheet per build seen on urlscan.io
  up to 2026-11-25. They also find rebrands without the family title (VaptX,
  ARTIFEX, HACK DOG, Cybrion, ArkanaAI). Builds also load a 49 KB stylesheet
  that unrelated applications share; it is left out.

  urlscan.io stores the SHA-256 of every file a page loads, so athar convert
  turns these selections into urlscan hash: searches. Other engines only hash
  landing pages and favicons; the ARTEX stylesheets rule covers them with the
  files' paths. The scanner sends the probes with -probes.

  To add a file, add a probe with its path and a selection_file_<probe> with
  its hash. A file name can survive a rebuild with new content (the DAO
  build), so one selection may list several hashes.
references:
  - https://urlscan.io/search/#hash%3Aff75f55ed6baeb22cee166fd7281a5f3b9243678b9b04ae41c8a84ae39cc02f5
