tests:
  # Hashes of stylesheets urlscan.io recorded up to 2026-11-25; the
  # no_match hashes are samples.
  - name: ARTEX console serving the stylesheet
    expect: match
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
    probes:
      css_4384baud_6ozc:
        http.status_code: 200
        http.body.sha256: ff75f55ed6baeb22cee166fd7281a5f3b9243678b9b04ae41c8a84ae39cc02f5
  - name: Rebrand serving the same stylesheet
    expect: match
    response:
      http.title: 'VaptX'
    probes:
      css_4384baud_6ozc:
        http.status_code: 200
        http.body.sha256: ff75f55ed6baeb22cee166fd7281a5f3b9243678b9b04ae41c8a84ae39cc02f5
  - name: DAO build, same file name with other content
    expect: match
    response:
      http.title: 'DAO — 自主渗透测试控制台'
    probes:
      css_4384baud_6ozc:
        http.status_code: 200
        http.body.sha256: 37761e79441b9be7852117179316c4893cba3077be14e2dc293a4d87478576ce
  - name: Older build with webpack file names
    expect: match
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
    probes:
      css_eba9231147484ecf:
        http.status_code: 200
        http.body.sha256: 432281d1bc8715666a33ba779673f805b698d7a229b2fb2a0250eacca9855ceb
  - name: Unknown build, same file name with other content
