title: Offensive Tool - nps web management redirect
id: b886fe09-f291-4030-bed3-680ccc3598c6
related:
  - id: 4da6da61-bbe3-46c0-bd9f-14889af1b313   # Offensive Tool - nps server error page
    type: similar
status: experimental
description: |
  Web management interface of an nps server, the open-source intranet
  penetration proxy. Without a session, GET / shows no page: the base
  controller (web/controllers/base.go) answers 302 with the location
  /login/index. The interface is built on the beego framework, which names
  itself in the Server header, "beegoServer:" and its version, and sets the
  session cookie beegosessionID. The baseline probe follows no redirect, so
  the rule matches the redirect with those two beego defaults. Another beego
  application whose login page is at /login/index would match too, hence the
  medium confidence. The default credentials in the sample configuration are
  admin and 123, so exposed interfaces are often open to anyone.
references:
  - https://github.com/ehang-io/nps
  - https://github.com/ehang-io/nps/blob/master/web/controllers/base.go
author: Ialle Teixeira
date: 2026-11-28
tags:
  - attack.command_and_control
  - attack.t1572
  - attack.t1090
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
target:
  protocol: http
  tls: auto
  ports: [8080]   # web_port in the sample nps.conf
detection:
  selection_redirect:
    http.status_code: 302
    http.headers.location: '/login/index'
    http.headers.server|startswith: 'beegoServer'
    http.headers.set-cookie|startswith: 'beegosessionID='
  condition: selection_redirect
identifies:
  product: nps
  family: nps
  category: offensive-tool
confidence: medium
falsepositives:
  - Other beego applications whose login page is at /login/index
  - Legitimate use by administrators and developers who publish services from behind NAT
tests:
  # Captured on 2026-11-28 from the web_port of nps (master) started on
  # localhost with its sample nps.conf.
  - name: Redirect to the login page
    expect: match
    raw: "HTTP/1.1 302 Found\r\nContent-Type: text/html; charset=utf-8\r\nLocation: /login/index\r\nServer: beegoServer:1.12.0\r\nSet-Cookie: beegosessionID=8f59253362dfc5c22f545c17cf426865; Path=/; HttpOnly\r\nDate: Sat, 28 Nov 2026 16:11:47 GMT\r\nContent-Length: 35\r\n\r\n<a href=\"/login/index\">Found</a>.\n\n"
  # Made-up near misses.
  - name: beego application with another login path
    expect: no_match
    response:
      http.status_code: 302
      http.headers.location: '/login'
      http.headers.server: 'beegoServer:1.12.0'
      http.headers.set-cookie: 'beegosessionID=8f59253362dfc5c22f545c17cf426865; Path=/; HttpOnly'
  - name: Same login path on another framework
    expect: no_match
    response:
      http.status_code: 302
      http.headers.location: '/login/index'
      http.headers.server: 'nginx'
      http.headers.set-cookie: 'PHPSESSID=8f59253362dfc5c22f545c17cf426865; path=/'
