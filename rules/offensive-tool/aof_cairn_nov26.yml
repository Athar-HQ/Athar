title: Agentic Offensive Framework - Cairn
id: de0b1c3f-b9a8-43c7-9073-36b9f91c5a70
status: experimental
description: |
  Web console of a customized fork of Cairn, an open-source AI penetration
  testing framework in which model-driven agent workers coordinate through a
  shared blackboard. Unit 42 reports that the cluster CL-STA-1238, which it
  assesses as China-nexus, used the fork against at least 19 organisations
  in August and September 2026. Matched by the fork's console title, which
  starts with "衍迹 · " ("Evolutionary Traces", Cairn's Chinese name in
  upstream docs/specs/server-protocol.md) followed by the workbench name:
  "衍迹 · 自主探索工作台" ("Autonomous Exploration Workbench"), seen on the
  actor's servers, and "衍迹 · 意图驱动推理工作台" ("Intent-Driven Reasoning
  Workbench"), seen on a host that serves the fork's auto-generated
  certificate. Upstream Cairn is titled "Cairn", listens on port 8000
  without TLS and shows none of these signals. Consoles rebranded with
  another name in front of the workbench are not matched here; the fork's
  TLS certificate is covered by separate rules.
references:
  - https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/
  - https://definitely-not-c2.com/Autonomous_AI_Hunting/
  - https://github.com/oritera/Cairn
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8081]   # the actor's console (Shodan history)
detection:
  selection_title:
    http.title|startswith: '衍迹 · '
  condition: selection_title
identifies:
  product: Cairn
  family: cairn
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
  - Upstream Cairn, if it ever uses its Chinese name in the console title (it is titled "Cairn" today)
tests:
  # Minimal samples built from the titles seen on FOFA and urlscan.io (see native).
  - name: Console title
    expect: match
    response:
      http.title: '衍迹 · 自主探索工作台'
  - name: Second workbench title
    expect: match
    response:
      http.title: '衍迹 · 意图驱动推理工作台'
  - name: Rebranded workbench (left to the certificate rules)
    expect: no_match
    response:
      http.title: '长亭AI渗透平台 · 自主探索工作台'
  - name: Upstream console
    expect: no_match
    response:
      http.title: 'Cairn'
  - name: Other workbench title
    expect: no_match
    response:
      http.title: '自主探索工作台'
native:
  modat: 'same_service(protocol="http" transport="tcp" http.title="衍迹 · 自主探索工作台")'
  # 2026-11-25: 1 host, titled "衍迹 · 意图驱动推理工作台".
  urlscan: 'page.tlsIssuer:"Cairn auto-generated TLS certificate"'
