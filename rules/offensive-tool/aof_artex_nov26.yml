title: Agentic Offensive Framework - ARTEX family
id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b
status: experimental
description: |
  Web console of an agentic offensive framework (AOF) that is deployed under
  many brand names (ARTEX, AntiFox, NKW, LMTex, MiniHunter, SHRIKE, SKARN,
  GOOGTEX and others). The family is named after ARTEX, its most common brand.
  Every brand keeps the same title suffix in one of three languages: Chinese
  '自主渗透测试控制台' (most common), Korean '자율 침투 테스트 콘솔' or English
  'Autonomous Penetration Testing Console'. The brand comes before the suffix,
  separated by an em dash, a colon or a middle dot. Matching the suffix instead
  of the brand is what finds the rebrands.
references:
  - https://x.com/MalGamy12/status/2115089738403037207
  - https://x.com/SansLimit3/status/2118049610996564345
author: Gameel Ali (@MalGamy12)
date: 2026-11-24
modified: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8787, 8443, 443, 80]   # most consoles listen on 8787 (Modat, 2026-11-25)
detection:
  selection_title:
    http.title|contains:
      - '自主渗透测试控制台'
      - '자율 침투 테스트 콘솔'
      - 'Autonomous Penetration Testing Console'
  condition: selection_title
identifies:
  family: artex
  category: offensive-tool
extract:
  brand:
    field: http.title
    regex: '^(?P<brand>.+?)\s*[—–\-:·]\s*(?:自主渗透测试控制台|자율 침투 테스트 콘솔|(?i:Autonomous Penetration Testing Console))'
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
  - Unrelated products whose title uses the same descriptive phrase
tests:
  # Captured landing page of an ARTEX console, body shortened.
  - name: ARTEX landing page as received
    expect: match
    extracted: { brand: ARTEX }
    raw: |
      HTTP/1.1 200 OK
      Accept-Ranges: bytes
      Content-Type: text/html; charset=utf-8

      <!DOCTYPE html><html id="__next_error__"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="preload" href="/_next/static/chunks/4384baud_6ozc.css" as="style"/><title>ARTEX — 自主渗透测试控制台</title><meta name="description" content="LLM 驱动的自主渗透测试系统控制台"/><link rel="icon" href="/favicon.ico?favicon.1uboyqwm7-s27.ico" sizes="48x48" type="image/x-icon"/></head><body></body></html>
  # Minimal samples built from the published titles, not captured responses.
  - name: ARTEX, Chinese title, em dash
    expect: match
    extracted: { brand: ARTEX }
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
  - name: ARTEX, Korean title, colon
    expect: match
    extracted: { brand: ARTEX }
    response:
      http.title: 'ARTEX: 자율 침투 테스트 콘솔'
  - name: Middle dot separator
    expect: match
    extracted: { brand: Pobi v2 }
    response:
      http.title: 'Pobi v2 · 自主渗透测试控制台'
  - name: Brand containing a hyphen
    expect: match
    extracted: { brand: 海盗船-内部渗透框架 }
    response:
      http.title: '海盗船-内部渗透框架 — 自主渗透测试控制台'
  - name: English title
    expect: match
    extracted: { brand: NKW }
    response:
      http.title: 'NKW — Autonomous Penetration Testing Console'
  - name: Chinese pentest services page
    expect: no_match
    response:
      http.title: '渗透测试服务 | 示例安全公司'
  - name: English pentest vendor page
    expect: no_match
    response:
      http.title: 'Penetration Testing Services | Example Corp'
native:
  shodan: 'title:"自主渗透测试控制台","자율 침투 테스트 콘솔"'
  censys: 'host.services.endpoints.http.html_title=~".*自主渗透测试控制台"'
  fofa: 'title="自主渗透测试控制台"'
