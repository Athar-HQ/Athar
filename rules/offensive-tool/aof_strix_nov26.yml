title: Agentic Offensive Framework - Strix
id: 808ca4a3-24b1-4359-9e17-8018263205ca
status: experimental
description: |
  Results viewer of Strix, an open-source AI penetration testing tool that
  runs autonomous agents against applications. Matched by the viewer title
  "Strix Results" from strix/interface/viewer/frontend/index.html. The
  Server header and favicon are separate rules. The viewer binds to
  127.0.0.1 on a random port unless it is started with --host, so the rules
  list no ports.
references:
  - https://github.com/usestrix/strix
  - https://definitely-not-c2.com/Autonomous_AI_Hunting/
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_main:
    http.title|contains: 'Strix Results'
  condition: selection_main
identifies:
  product: Strix
  category: offensive-tool
confidence: medium
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Minimal samples built from values in the project repository.
  - name: Viewer title
    expect: match
    response:
      http.title: 'Strix Results'
  - name: Other results page
    expect: no_match
    response:
      http.title: 'Scan Results'
native:
  modat: 'same_service(protocol="http" transport="tcp" http.title~"Strix Results")'
