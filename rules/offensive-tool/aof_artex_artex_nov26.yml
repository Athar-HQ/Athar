title: Agentic Offensive Framework - ARTEX
id: 0536c409-98ed-4d1d-8e07-7c80b39a4f53
related:
  - id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b
    type: variant-of
status: experimental
description: |
  The ARTEX-branded deployment, the most common brand of the family.
  Recognised by the family title plus either the ARTEX brand at the start of
  the title (ARTEX, ARTEX MX, ARTEX-PRO) or the ARTEX favicon. The favicon hash
  is the one the published variant hunt excludes as the original.
references:
  - https://x.com/MalGamy12/status/2115089738403037207
author: Gameel Ali (@MalGamy12)
date: 2026-11-24
modified: 2026-11-26
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
  ports: [8787, 8443, 443, 80]   # most consoles listen on 8787 (Modat, 2026-11-25)
detection:
  selection_title:
    http.title|contains:
      - '自主渗透测试控制台'
      - '자율 침투 테스트 콘솔'
      - 'Autonomous Penetration Testing Console'
      - 'Console de teste de penetração autônomo'
      - 'Консоль автономного пентеста'
  selection_brand:
    http.title|startswith: 'ARTEX'
  selection_icon:
    http.favicon.mmh3: -576220750
  condition: selection_title and (selection_brand or selection_icon)
identifies:
  product: ARTEX
  family: artex
  category: offensive-tool
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Minimal samples built from the published titles and favicon hash, not captured responses.
  - name: ARTEX, Chinese title
    expect: match
    response:
      http.title: 'ARTEX — 自主渗透测试控制台'
  - name: ARTEX-PRO, Chinese title
    expect: match
    response:
      http.title: 'ARTEX-PRO — 自主渗透测试控制台'
  - name: ARTEX, Korean title
    expect: match
    response:
      http.title: 'ARTEX: 자율 침투 테스트 콘솔'
  - name: ARTEX, Russian title
    expect: match
    response:
      http.title: 'ARTEX — Консоль автономного пентеста'
  - name: ARTEX, Portuguese title
    expect: match
    response:
      http.title: 'ARTEX — Console de teste de penetração autônomo'
  - name: Rebranded title with the ARTEX favicon
    expect: match
    response:
      http.title: '渗透工作台 — 自主渗透测试控制台'
      http.favicon.mmh3: -576220750
  - name: Other brand of the family
    expect: no_match
    response:
      http.title: 'GOOGTEX — 자율 침투 테스트 콘솔'
      http.favicon.mmh3: 1234567890
native:
  fofa: 'title="自主渗透测试控制台" && (title="ARTEX" || icon_hash="-576220750")'
