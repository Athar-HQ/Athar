title: Agentic Offensive Framework - ARTEX family
id: 0ce69e91-baee-4475-81ee-4b8eca1a6c3b
status: experimental
description: |
  Web console of an agentic offensive framework (AOF) that is deployed under
  several brand names (ARTEX, NKW, AntiFox, ARGOS, HekerAI, ExploitFinder,
  RedOps). The family is named after ARTEX, its most common brand. All brands
  share the title suffix and reference the '/function/tasks' route in the
  landing page.
references:
  - https://x.com/MalGamy12   # "[1] Hunting AI-Powered Penetration Testing Infrastructure"
author: Gameel Ali (@MalGamy12)
date: 2026-11-24
tags:
  - attack.resource_development
  - attack.t1588.002
  - category.offensive-tool
  - aof
target:
  protocol: http
  tls: auto
detection:
  selection_title:
    http.title|contains: 'Autonomous Penetration Testing Console'
  selection_route:
    http.body|contains: '/function/tasks'
  condition: selection_title and selection_route
identifies:
  family: artex
  category: offensive-tool
extract:
  brand:
    field: http.title
    regex: '^(?P<brand>.+?)\s+[—–-]\s+Autonomous Penetration Testing Console'
confidence: high
falsepositives:
  - Authorised deployments by red teams (the tooling is dual-use)
tests:
  # Minimal samples built from the published title and route, not captured responses.
  - name: NKW branding
    expect: match
    extracted: { brand: NKW }
    response:
      http.title: 'NKW — Autonomous Penetration Testing Console'
      http.body: '... /function/tasks ...'
  - name: Unrelated pentest vendor page
    expect: no_match
    response:
      http.title: 'Penetration Testing Services | Example Corp'
      http.body: '...'
native:
  fofa: '"Autonomous penetration testing" && body="/function/tasks"'
