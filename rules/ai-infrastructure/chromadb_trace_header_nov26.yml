title: AI Infrastructure - Chroma server trace header
id: dd2e00c3-b429-45bf-b507-9a47563f08ff
status: experimental
description: |
  HTTP server of Chroma, the open-source vector database behind many
  retrieval-augmented generation applications. The server has no page at
  "/": the baseline request gets an empty 404. What identifies it is a
  response header of its own, chroma-trace-id, which the server adds to every
  answer, the 404 included. The rule matches the presence of that header.
  Chroma has no authentication unless the operator configures it, so an
  exposed server usually lets anyone list, read and delete collections
  through /api/v2.
references:
  - https://github.com/chroma-core/chroma
  - https://docs.trychroma.com/
author: Ialle Teixeira
date: 2026-11-28
tags:
  - category.ai-infrastructure
target:
  protocol: http
  tls: auto
  ports: [8000]   # default port of "chroma run"
detection:
  selection_header:
    http.headers.chroma-trace-id|exists: true
  condition: selection_header
identifies:
  product: Chroma
  family: chroma
  category: ai-infrastructure
confidence: high
falsepositives:
  - Proxies or gateways in front of Chroma that pass the header on with their own pages
tests:
  # Captured on 2026-11-28 from "chroma run" 1.5.9 started on localhost.
  - name: Empty 404 on the root path
    expect: match
    raw: "HTTP/1.1 404 Not Found\r\nchroma-trace-id: 00000000000000000000000000000000\r\ncontent-length: 0\r\ndate: Sat, 28 Nov 2026 16:05:06 GMT\r\n\r\n"
  # Made-up near misses.
  - name: Empty 404 from another server
    expect: no_match
    raw: "HTTP/1.1 404 Not Found\r\ncontent-length: 0\r\ndate: Sat, 28 Nov 2026 16:05:06 GMT\r\n\r\n"
  - name: Other tracing header
    expect: no_match
    response:
      http.status_code: 404
      http.headers.x-trace-id: '00000000000000000000000000000000'
