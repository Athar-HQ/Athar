title: AionUi favicon
id: 852a5e3a-262d-4b67-ae41-f7b722f3a8f1
related:
  - id: e1946a84-31a6-495d-a18d-1651eef0e895   # AionUi
    type: similar
status: experimental
description: |
  Web UI of AionUi, an open-source app that runs and coordinates CLI coding agents
  (Claude Code, Codex, OpenCode and others). Matched by its icon public/pwa/icon-192.png by
  MurmurHash3 (Shodan/FOFA style), computed from the file in the repository.
references:
  - https://github.com/iOfficeAI/AionUi
author: Gameel Ali (@MalGamy12)
date: 2026-11-25
tags:
  - category.ai-infrastructure
target:
  protocol: http
  tls: auto
detection:
  selection_main:
    http.favicon.mmh3: 1752387058
  condition: selection_main
identifies:
  product: AionUi
  family: aionui
  category: ai-infrastructure
confidence: high
falsepositives:
  - Legitimate self-hosted deployments, which are the usual case
tests:
  # Minimal samples built from values in the project repository.
  - name: Web UI icon
    expect: match
    response:
      http.favicon.mmh3: 1752387058
  - name: Other icon
    expect: no_match
    response:
      http.favicon.mmh3: 1234567890
